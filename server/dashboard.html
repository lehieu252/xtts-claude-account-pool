<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Pool</title>
<style>
/* Bảng theo dõi: trạng thái chung ở trên, máy và lịch sử ở giữa, log ở dưới */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --fg: #1b2228; --muted: #5f6b75; --line: #dce2e6;
  --accent: #1f6f8b; --ok: #2d7a46; --warn: #a3600a; --bad: #b3362f; --chip: #eef3f5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11161a; --surface: #192026; --fg: #e5eaee; --muted: #9aa6b0; --line: #2a333b;
  --accent: #6cb7d3; --ok: #6cc28a; --warn: #e0a24a; --bad: #ef7f77; --chip: #222b33; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 20px; }
h2 { margin: 0 0 10px; font-size: 15px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.pill { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; }
.STABLE { color: var(--ok); } .PREPARING { color: var(--warn); } .MOVING { color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { border-left: 4px solid var(--bad); background: var(--surface); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.alert.warn { border-color: var(--warn); }
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 260px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 6px; font-size: 12px; }
.chip.mover { color: var(--accent); font-weight: 600; }
.mismatch { color: var(--warn); font-weight: 600; }
.ev-move_fail, .ev-switch_fail, .ev-error, .ev-no_holder { color: var(--bad); font-weight: 600; }
.ev-move_ok, .ev-switch_ok { color: var(--ok); }
.ev-no_destination, .ev-read_fail { color: var(--warn); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Account Pool</h1>
    <span class="muted" id="updated">Đang tải…</span>
  </header>

  <div class="panel hero">
    <div class="stat"><span class="k">Pha</span><span class="v" id="phase">—</span></div>
    <div class="stat"><span class="k">Account Premium</span><span class="v mono" id="premium">—</span></div>
    <div class="stat"><span class="k">Account đích (P mới)</span><span class="v mono" id="target">—</span></div>
    <div class="stat"><span class="k">Máy 2 (chuyển seat)</span><span class="v" id="mover">—</span></div>
  </div>
  <div class="muted" id="statemsg"></div>

  <div class="alerts" id="alerts"></div>

  <div class="panel">
      <h2>Các máy</h2>
      <div class="tbl"><table>
        <thead><tr><th>Máy</th><th>Host</th><th>Vai trò</th><th>Account đang dùng</th><th>Ở info</th><th>Version</th><th>Lần cuối</th></tr></thead>
        <tbody id="machines"><tr><td colspan="7" class="muted">Chưa có máy nào báo trạng thái.</td></tr></tbody>
      </table></div>
  </div>

  <div class="panel">
      <h2>Lịch sử pha</h2>
      <div class="tbl"><table>
        <thead><tr><th>Lúc</th><th>Pha</th><th>Premium → đích</th><th>Ghi chú</th></tr></thead>
        <tbody id="transitions"><tr><td colspan="4" class="muted">Chưa có lần chuyển seat nào.</td></tr></tbody>
      </table></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(sec) {
  if (sec < 0) sec = 0;
  if (sec < 60) return Math.round(sec) + " giây trước";
  if (sec < 3600) return Math.round(sec / 60) + " phút trước";
  if (sec < 86400) return Math.round(sec / 3600) + " giờ trước";
  return Math.round(sec / 86400) + " ngày trước";
}
const clock = (t) => new Date(t * 1000).toLocaleString("vi-VN", { hour12: false });

function render(d) {
  const st = d.state, now = st.server_time;
  $("phase").innerHTML = `<span class="pill ${esc(st.phase)}">${esc(st.phase)}</span>`;
  $("premium").textContent = st.premium || "—";
  $("target").textContent = st.phase === "STABLE" ? "—" : (st.target || "—");
  $("statemsg").textContent = `Cập nhật pha ${ago(now - st.updated_at)}${st.message ? " · " + st.message : ""}`;

  const movers = d.machines.filter((m) => m.role === "mover");
  const mover = movers.sort((a, b) => b.last_seen - a.last_seen)[0];
  const moverOk = mover && now - mover.last_seen <= d.mover_stale_sec;
  $("mover").innerHTML = mover
    ? `<span class="dot ${moverOk ? "on" : "off"}"></span>${moverOk ? "Đang chạy" : "Không hoạt động"} <span class="muted" style="font-size:13px;font-weight:400">· ${ago(now - mover.last_seen)}</span>`
    : `<span class="dot off"></span>Chưa kết nối`;

  const alerts = [];
  if (!moverOk) alerts.push(["bad", mover ? `Máy 2 không báo trạng thái ${ago(now - mover.last_seen)}: không ai chuyển seat cho đến khi máy 2 chạy lại.` : "Máy 2 chưa kết nối lần nào."]);
  if (st.phase !== "STABLE" && now - st.updated_at > 300) alerts.push(["warn", `Pha ${st.phase} đã kéo dài ${ago(now - st.updated_at).replace(" trước", "")}.`]);
  const fail = d.log.find((r) => r.event === "move_fail");
  if (fail && now - fail.received < 3600) alerts.push(["bad", `Chuyển seat thất bại lúc ${esc(fail.ts)}: ${esc((fail.message || "").slice(0, 300))}`]);
  const stale = d.machines.filter((m) => m.active && m.role !== "mover" && st.phase === "STABLE" && st.premium && m.account && m.account !== st.premium && m.account);
  if (stale.length) alerts.push(["warn", `Máy chưa ở account Premium: ${stale.map((m) => esc(m.name || m.host)).join(", ")}.`]);
  $("alerts").innerHTML = alerts.map(([k, t]) => `<div class="alert ${k === "warn" ? "warn" : ""}">${t}</div>`).join("");

  $("machines").innerHTML = d.machines.length ? d.machines.map((m) => {
    const mismatch = m.role !== "mover" && st.phase === "STABLE" && st.premium && m.account && m.account !== st.premium;
    return `<tr>
      <td><span class="dot ${m.active ? "on" : ""}"></span>${esc(m.name || "?")}</td>
      <td class="mono">${esc(m.host)}</td>
      <td><span class="chip ${m.role === "mover" ? "mover" : ""}">${m.role === "mover" ? "Máy 2 · chuyển seat" : "Làm việc"}</span></td>
      <td class="mono ${mismatch ? "mismatch" : ""}">${esc(m.account || "—")}</td>
      <td>${m.role === "mover" ? "—" : (m.at_info ? "Có" : "Không")}</td>
      <td class="mono">${esc(m.version)}</td>
      <td>${ago(now - m.last_seen)}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="muted">Chưa có máy nào báo trạng thái.</td></tr>`;

  $("transitions").innerHTML = d.transitions.length ? d.transitions.map((t) => `<tr>
      <td>${clock(t.at)}</td><td><span class="pill ${esc(t.phase)}">${esc(t.phase)}</span></td>
      <td class="mono">${esc(t.premium || "—")}${t.target && t.phase !== "STABLE" ? " → " + esc(t.target) : ""}</td>
      <td class="wrap">${esc(t.message)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="muted">Chưa có lần chuyển seat nào.</td></tr>`;


  $("updated").textContent = "Làm mới lúc " + new Date().toLocaleTimeString("vi-VN", { hour12: false }) + " · mỗi 5 giây";
}


async function refresh() {
  const q = new URLSearchParams({ limit: "50" });  // only for the "seat move failed" alert
  try {
    const r = await fetch("api/dashboard?" + q, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    $("updated").textContent = "Không tải được dữ liệu (" + e.message + "), thử lại sau 5 giây";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
